<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#6e2346">
<title>一問一答ドリル</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: おうちベースと同じ梅と三つ葉の配色。単語カード風の一列レイアウトで、教科ごとに差し色が変わる */
:root{
  --bg:#fbf1f4; --card:#fffcfd; --ink:#3b1830; --sub:#7c6372; --line:#efd9e1;
  --wine:#6e2346; --wine2:#93365f; --gold:#b88a3e; --gold-hi:#f2d99a; --gold-lo:#8a6426;
  --rika:#3f8a48; --shakai:#a8692a; --eigo:#3f6fc6;
  --ok:#2f7f4a; --ok-bg:#e3f3e7; --ng:#c0325d; --ng-bg:#fbe4ec;
  --accent:var(--rika); --accent-soft:#e6f2e7;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b0d17; --card:#28131f; --ink:#fbeef3; --sub:#c3a6b6; --line:#43233a;
  --wine:#3a0f26; --wine2:#5e1c3e; --gold:#ddb76b; --gold-hi:#fbe6b0; --gold-lo:#a47b36;
  --rika:#72c27a; --shakai:#e0a35c; --eigo:#7aa2ff;
  --ok:#6fd08e; --ok-bg:#163021; --ng:#f27a9d; --ng-bg:#3d1626; --accent-soft:#2f1f2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b0d17; --card:#28131f; --ink:#fbeef3; --sub:#c3a6b6; --line:#43233a;
  --wine:#3a0f26; --wine2:#5e1c3e; --gold:#ddb76b; --gold-hi:#fbe6b0; --gold-lo:#a47b36;
  --rika:#72c27a; --shakai:#e0a35c; --eigo:#7aa2ff;
  --ok:#6fd08e; --ok-bg:#163021; --ng:#f27a9d; --ng-bg:#3d1626; --accent-soft:#2f1f2a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
body[data-s="rika"]{--accent:var(--rika)} body[data-s="shakai"]{--accent:var(--shakai)} body[data-s="eigo"]{--accent:var(--eigo)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:12px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.home-link{display:inline-flex;align-items:center;gap:4px;color:var(--wine2);text-decoration:none;font-weight:700;font-size:.9rem;border:1px solid var(--gold);border-radius:999px;padding:4px 12px;background:var(--card)}
.saving{font-size:.8rem;color:var(--sub)}
h1{font-family:var(--f-disp);font-weight:800;font-size:1.7rem;margin:0;letter-spacing:.04em;line-height:1.3}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.78rem;color:var(--sub);letter-spacing:.06em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px}
.tab{border:0;background:transparent;border-radius:10px;padding:10px 0;font-weight:700;font-size:1.05rem;color:var(--sub)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.terms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.term{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 0;font-weight:700;font-size:1rem;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.term em{font-style:normal;font-size:.68rem;padding:1px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.term[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 16px}
.summary b{display:block;font-size:1.15rem}
.summary span{font-size:.82rem;opacity:.92}
.weak{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2px dashed var(--ng);background:var(--ng-bg);border-radius:14px;padding:12px 14px;width:100%;text-align:left}
.weak b{font-size:1.05rem}
.weak span{font-size:.85rem;color:var(--sub)}
.weak .go{font-weight:700;color:var(--ng);white-space:nowrap}
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:14px 16px;text-align:left;width:100%}
.unit .nm{font-weight:700;font-size:1.05rem}
.unit .meta{font-size:.82rem;color:var(--sub)}
.badge{font-variant-numeric:tabular-nums;font-weight:700;font-size:.88rem;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.none{color:var(--sub);background:transparent;border:1px solid var(--line)}
.summary .badge{background:rgba(255,255,255,.2);color:#fff;border:0}
.note{font-size:.8rem;color:var(--sub);margin:0}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:.9rem}
.qlabel{font-size:.85rem;color:var(--sub);text-align:right}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:6px}
.qno{font-weight:700;color:var(--accent);font-size:.88rem;letter-spacing:.04em}
.qtext{font-size:1.15rem;font-weight:700;margin:0;word-break:break-word}
.choices{display:flex;flex-direction:column;gap:10px}
.ch{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:1.05rem;width:100%}
.ch .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:.9rem;color:var(--sub)}
.ch.ok{border-color:var(--ok);background:var(--ok-bg)} .ch.ok .k{background:var(--ok);color:#fff}
.ch.ng{border-color:var(--ng);background:var(--ng-bg)} .ch.ng .k{background:var(--ng);color:#fff}
.ch:disabled{cursor:default;color:var(--ink)}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.fb.ok{background:var(--ok-bg)} .fb.ng{background:var(--ng-bg)}
.fb b{font-size:1.1rem}
.fb.ok b{color:var(--ok)} .fb.ng b{color:var(--ng)}
.fb p{margin:0;font-size:.92rem}
.ask{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ask p{margin:0;font-size:.85rem;color:var(--sub)}
.gem{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--gold);border-radius:10px;padding:10px;color:var(--ink);background:var(--bg);text-decoration:none;font-size:.92rem;font-weight:700}
.gem-copy{width:100%;min-height:96px;font-size:.82rem;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:1.1rem;width:100%}
.secondary{border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:12px;padding:12px;font-weight:700;font-size:1.05rem;width:100%}
.score{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 18px;text-align:center}
.score .big{font-family:var(--f-disp);font-weight:800;font-size:3.2rem;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.score .big small{font-size:1.4rem;color:var(--sub)}
.score p{margin:6px 0 0}
.mlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.mlist li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.93rem}
.mlist .ans{color:var(--ok);font-weight:700}
h2{font-size:1.05rem;margin:4px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--wine);color:var(--gold-hi);border:1px solid var(--gold);padding:8px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:6}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.bar i,.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home-link" id="homeLink" href="#">← おうちベース</a><span class="saving" id="who"></span></div>

  <section id="home">
    <div style="display:flex;flex-direction:column;gap:14px">
      <h1><small>中学1年・定期テスト対策(新宿区の採択教科書準拠)</small>一問一答ドリル</h1>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="terms" id="terms"></div>
      <button class="summary" id="sumBtn"></button>
      <button class="weak" id="weakBtn" hidden></button>
      <div class="units" id="units"></div>
      <p class="note" id="texNote"></p>
      <p class="note">1回10問・4択(学期まとめは20問)。間違えた問題は「苦手」に入り、正解すると外れます。結果はおうちベースに記録され、家族の学習タブで見られます。</p>
    </div>
  </section>

  <section id="quiz" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="qhead"><button class="back" id="quitBtn">← やめる</button><div class="qlabel" id="qlabel"></div></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="qcard"><div class="qno" id="qno"></div><p class="qtext" id="qtext"></p></div>
      <div class="choices" id="choices"></div>
      <div class="fb" id="fb" hidden></div>
      <div class="ask" id="ask" hidden>
        <p>もっと知りたいときは、問題をコピーしてGeminiで質問できます。</p>
        <a class="gem" id="gemBtn" href="https://gemini.google.com/app" target="_blank" rel="noopener">Geminiで続きを聞く(問題をコピーして開く)</a>
        <textarea class="gem-copy" id="gemCopy" readonly hidden aria-label="Geminiに貼り付ける文章"></textarea>
      </div>
      <button class="primary" id="nextBtn" hidden>次の問題へ</button>
    </div>
  </section>

  <section id="result" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="score"><div class="big" id="sc"></div><p id="scMsg"></p></div>
      <button class="primary" id="retryWrong" hidden>間違えた問題だけもう一度</button>
      <button class="secondary" id="retryAll">同じ範囲をもう一度</button>
      <button class="back" id="homeBtn" style="align-self:center">単元えらびにもどる</button>
      <h2 id="mhead" hidden>間違えた問題</h2>
      <ul class="mlist" id="mlist"></ul>
    </div>
  </section>

  <section id="noUser" hidden>
    <div class="qcard"><p class="qtext">おうちベースで家族の登録をしてから開いてください。</p></div>
  </section>
</div>

<script>window.STUDY_DATA={"rika":{"name":"理科","textbook":"東京書籍「新しい科学 1」","terms":[{"term":1,"units":[{"id":"r1-1","name":"生物の観察と分類のしかた","q":[["ルーペで、手に持てる花を観察するときの正しい使い方は?","ルーペを目に近づけて持ち、花を前後に動かす",["ルーペを花に近づけて持ち、顔を前後に動かす","ルーペを目から離して持ち、花を前後に動かす","ルーペを目から離して持ち、ルーペを前後に動かす"],"ルーペは目に近づけたまま。動かせる物は物の方を前後に動かす。"],["ルーペで、動かせない木の幹を観察するときの正しい方法は?","ルーペを目に近づけたまま、顔を前後に動かす",["ルーペを幹に近づけ、ルーペだけを前後に動かす","ルーペを目から離し、顔を前後に動かす","ルーペを目から離し、幹に押し当てる"],"動かせない物は、ルーペを目に近づけたまま顔を前後に動かす。"],["ルーペで太陽を絶対に見てはいけない理由は?","目をいためるから",["レンズがくもるから","像が上下左右逆になるから","ルーペが熱で溶けるから"],"レンズが光を集めるため、太陽を見ると目をいためる危険がある。"],["顕微鏡を持ち運ぶときの正しい持ち方は?","一方の手でアームをにぎり、もう一方の手を鏡台の下にそえる",["両手で鏡筒をつかんで持つ","片手でステージをつかんで持つ","片手で接眼レンズの部分を持つ"],"落とさないよう、アームと鏡台を両手で持って運ぶ。"],["顕微鏡にレンズをとりつける順番として正しいものは?","接眼レンズを先にとりつけ、次に対物レンズをとりつける",["対物レンズを先にとりつけ、次に接眼レンズをとりつける","接眼レンズと対物レンズを同時にとりつける","順番に決まりはない"],"鏡筒の中にほこりが入らないよう、接眼レンズを先につける。"],["顕微鏡でピントを合わせるときの正しい操作は?","横から見ながら対物レンズとプレパラートを近づけ、接眼レンズをのぞきながら遠ざけて合わせる",["接眼レンズをのぞきながら、対物レンズとプレパラートを近づけて合わせる","横から見ながら対物レンズとプレパラートを遠ざけ、のぞきながら近づけて合わせる","接眼レンズをのぞきながら、反射鏡を動かしてピントを合わせる"],"のぞきながら近づけると、レンズとプレパラートがぶつかるおそれがある。"],["接眼レンズが10倍、対物レンズが40倍のとき、顕微鏡の倍率は何倍か。","400倍",["50倍","40倍","4倍"],"倍率=接眼レンズの倍率×対物レンズの倍率=10×40=400倍"],["顕微鏡の倍率を低倍率から高倍率に変えると、視野の広さと明るさはどうなるか。","視野はせまくなり、暗くなる",["視野は広くなり、明るくなる","視野はせまくなり、明るくなる","視野は広くなり、暗くなる"],"高倍率にすると見える範囲がせまくなり、視野は暗くなる。"],["顕微鏡で観察を始めるとき、最初に使う倍率はどれか。","いちばん低い倍率",["いちばん高い倍率","中くらいの倍率","どの倍率から始めてもよい"],"低倍率は視野が広く、観察したいものを見つけやすい。"],["像が上下左右逆に見える顕微鏡で、観察物が視野の左上に見えた。視野の中央に移すには、プレパラートをどの向きに動かすか。","左上",["右下","右上","左下"],"像は逆に動くので、像が見える方向と同じ向きにプレパラートを動かす。"],["双眼実体顕微鏡の特徴として正しいものはどれか。","観察物を立体的に観察できる",["プレパラートをつくらないと観察できない","倍率が1000倍以上と非常に高い","片方の目だけでのぞいて観察する"],"両目で見るので立体的に観察でき、プレパラートも不要。"],["観察した生物をスケッチするときの正しい描き方は?","細い線ではっきりと描き、影はつけない",["線を何本も重ねて輪郭を描く","立体感を出すために影をつける","まわりの背景もくわしく描きこむ"],"観察対象だけを、細い線と点ではっきり描く。影や重ね描きはしない。"]]},{"id":"r1-2","name":"植物の分類","q":[["めしべの根もとにある、ふくらんだ部分を何というか。","子房",["胚珠","柱頭","やく"],"めしべの根もとのふくらんだ部分が子房で、中に胚珠がある。"],["子房の中にある小さな粒を何というか。","胚珠",["花粉","子房","種子"],"子房の中の粒を胚珠とい m以上)・砂・泥(1/16mm以下)に分ける。"],["うすい塩酸をかけると二酸化炭素が発生する堆積岩はどれか。","石灰岩",["チャート","凝灰岩","砂岩"],"石灰岩はうすい塩酸と反応して二酸化炭素が発生する。"],["非常にかたく、うすい塩酸をかけても気体が発生しない、生物の殻などからできた堆積岩はどれか。","チャート",["石灰岩","泥岩","れき岩"],"チャートは非常にかたく、塩酸をかけても気体は出ない。"],["サンゴの化石をふくむ地層は、堆積した当時どのような環境だったと考えられるか。","あたたかくて浅い海",["冷たくて深い海","河口付近の淡水","寒冷な陸地の湖"],"サンゴは示相化石。あたたかく浅い海だったことがわかる。"],["中生代の示準化石として適するものはどれか。","アンモナイト",["サンヨウチュウ","ビカリア","ナウマンゾウ"],"アンモナイトは中生代。サンヨウチュウは古生代、他は新生代。"],["れき岩や砂岩などの粒が丸みを帯びている理由は?","流水で運ばれる間に角がけずられたから",["火山の熱でとけたから","マグマが急に冷えたから","生物がけずったから"],"流水のはたらきで運ばれるうちに、角がとれて丸くなる。"]]},{"id":"r3-t","name":"都立入試の形で練習","q":[["光が鏡に入射角40°で当たったときの反射角(A)と、光が水中から空気中へ斜めに進むときの屈折角は入射角より(B)の組み合わせとして正しいものはどれか。","A:40° B:大きい",["A:50° B:大きい","A:40° B:小さい","A:50° B:小さい"],"反射角は入射角と等しい。水→空気では屈折角が入射角より大きい。"],["物体を凸レンズの焦点距離の2倍の位置に置いたとき、スクリーンにできる像の大きさ(A)と向き(B)の組み合わせとして正しいものはどれか。","A:実物と同じ B:上下左右が逆",["A:実物より大きい B:上下左右が逆","A:実物と同じ B:実物と同じ向き","A:実物より小さい B:実物と同じ向き"],"焦点距離の2倍の位置では、同じ大きさで逆向きの実像ができる。"],["物体を凸レンズと焦点の間に置いたときのようすについて正しく述べた文はどれか。","スクリーンに像はできず、レンズをのぞくと実物より大きい同じ向きの像が見える",["スクリーンに、実物より大きい逆向きの像ができる","スクリーンに、実物より小さい逆向きの像ができる","スクリーンに、実物と同じ大きさの同じ向きの像ができる"],"焦点より内側では実像はできず、虚像が見える。"],["いなずまが見えてから3秒後に雷の音が聞こえた。音の速さを340m/sとすると、雷までの距離はどれか。","1020m",["113m","340m","3400m"],"340×3=1020m。光はほぼ一瞬で届くとみなす。"],["音について、(A)が大きいほど音は大きく、(B)が多いほど音は高くなる。AとBの組み合わせとして正しいものはどれか。","A:振幅 B:振動数",["A:振動数 B:振幅","A:振幅 B:振幅","A:振動数 B:振動数"],"音の大小は振幅、音の高低は振動数で決まる。"],["弦が1回振動するのに0.02秒かかった。この音の振動数はどれか。","50Hz",["20Hz","0.02Hz","500Hz"],"1秒間の振動の回数なので1÷0.02=50Hz。"],["音の伝わり方について正しく述べた文はどれか。","真空中では音は伝わらない",["音は液体や固体の中は伝わらない","空気中を伝わる音の速さは光の速さより大きい","音は空気そのものが音源から耳まで移動して伝わる"],"音は物体の振動が次々と伝わる波で、伝える物質がないと伝わらない。"],["20gのおもりをつるすと2cmのびるばねがある。このばねに100gのおもりをつるしたときののびはどれか。(ばねは、ばねを引く力に比例してのびる)","10cm",["5cm","2cm","20cm"],"100÷20=5倍の力なので、のびも2×5=10cm(フックの法則)。"],["1つの物体にはたらく2力がつり合う条件について正しく述べた文はどれか。","大きさが等しく、向きが反対で、一直線上にある",["大きさが等しく、向きが同じで、一直線上にある","大きさが等しく、向きが反対で、一直線上にない","大きさが異なり、向きが反対で、一直線上にある"],"つり合う2力は、同じ大きさ・反対向き・同一直線上の3条件。"],["マグマのねばりけが強い火山の形(A)と、噴出物の色(B)の組み合わせとして正しい 綿花などを栽培。"],["アメリカ合衆国の北緯37度付近から南の、温暖で工業が発達した地域を何というか。","サンベルト",["グレートプレーンズ","プレーリー","パンパ"],"航空宇宙産業やICT産業などが発達した。"],["サンフランシスコ郊外にある、ICT関連企業が集中する地域を何というか。","シリコンバレー",["サンベルト","ウォール街","ハリウッド"],"半導体の原料ケイ素(シリコン)が名前の由来。"],["五大湖の近くの都市デトロイトで発達した工業はどれか。","自動車工業",["航空宇宙産業","ICT産業","繊維工業"],"大量生産方式により自動車工業が発達した。"],["メキシコなど中南アメリカからアメリカ合衆国に移り住んだ、スペイン語を話す人々を何というか。","ヒスパニック",["イヌイット","アボリジニ","マオリ"],"農業や建設業などで重要な働き手となっている。"]]},{"id":"s3-2","name":"地理:南アメリカ州","q":[["流域面積が世界最大の川はどれか。","アマゾン川",["ナイル川","ミシシッピ川","ラプラタ川"],"流域には広大な熱帯雨林が広がる。"],["南アメリカ大陸の西部を南北に連なる山脈はどれか。","アンデス山脈",["ロッキー山脈","アパラチア山脈","ヒマラヤ山脈"],"高地では標高に応じた農業や牧畜が行われる。"],["ブラジルの公用語はどれか。","ポルトガル語",["スペイン語","英語","フランス語"],"かつてポルトガルの植民地だったため。"],["アルゼンチンのラプラタ川流域に広がる草原を何というか。","パンパ",["プレーリー","タイガ","サヘル"],"小麦の栽培や牛の放牧がさかん。"],["森林や草原を焼き、その灰を肥料にして作物をつくる農業を何というか。","焼畑農業",["適地適作","混合農業","酪農"],"アマゾン川流域などで行われてきた。"],["ブラジルでさとうきびなどからつくられ、自動車の燃料に使われるものはどれか。","バイオ燃料",["石油","天然ガス","石炭"],"植物からつくる燃料。代表例がバイオエタノール。"],["アンデス山脈で栄え、16世紀にスペインにほろぼされた国はどれか。","インカ帝国",["アステカ王国","ローマ帝国","モンゴル帝国"],"マチュピチュの遺跡が有名。"]]},{"id":"s3-3","name":"地理:オセアニア州","q":[["オーストラリアの国土で最も広い面積を占める気候帯はどれか。","乾燥帯",["熱帯","温帯","寒帯"],"内陸部には砂漠や草原が広がる。"],["オーストラリアの先住民を何というか。","アボリジニ",["マオリ","イヌイット","ヒスパニック"],"独自の文化を守り、権利の回復が進められている。"],["ニュージーランドの先住民を何というか。","マオリ",["アボリジニ","イヌイット","ヒスパニック"],"ラグビーの「ハカ」はマオリの伝統的な踊り。"],["かつてオーストラリアがとっていた、ヨーロッパ系以外の移民を制限する政策を何というか。","白豪主義",["アパルトヘイト","多文化主義","一人っ子政策"],"廃止後は多文化社会をめざしている。"],["オーストラリア北西部で、露天掘りで大量に採掘されている鉱産資源はどれか。","鉄鉱石",["石炭","天然ゴム","カカオ"],"石炭は主に東部で採掘されている。"],["太平洋の島々のうち、ニュージーランドやハワイ諸島が含まれる地域はどれか。","ポリネシア",["ミクロネシア","メラネシア","インドネシア"],"ポリネシアは「多くの島々」という意味。"]]},{"id":"s3-4","name":"歴史:元寇と鎌倉幕府の滅亡・室町幕府","q":[["モンゴル帝国の皇帝で、国号を元と定めた人物はどれか。","フビライ・ハン",["チンギス・ハン","始皇帝","李成桂"],"チンギス・ハンの孫で、日本に服属を求めた。"],["元の服属要求を拒否し、元軍の襲来に対応した鎌倉幕府の執権はどれか。","北条時宗",["北条泰時","北条義時","北条政子"],"2度の元軍の襲来を退けた。"],["1274年の1度目の元軍の襲来を何というか。","文永の役",["弘安の役","承久の乱","応仁の乱"],"2度目は1281年の弘安の役。"],["元寇のあと生活に苦しむ御家人を救うため、借金を帳消しにさせた法令を何というか。","徳政令",["御成敗式目","分国法","大宝律令"],"1297年に出されたが、かえって混乱をまねいた。"],["鎌倉幕府をほろぼし、建武の新政を始めた天皇はどれか。","後醍醐天皇",["後鳥羽上皇","白河上皇","桓武天皇"],"公家重視の政治に武士の不満が高まった。"],["京都に室町幕府を開いた人物はどれか。","足利尊氏",["足利義満","足利義政","新田義貞"],"建武の新政に反対して兵をあげた。"],["後醍醐天皇が京都から逃れて朝廷(南朝)を開いた場所はどこか。","吉野",["鎌倉","大宰府","平泉"],"吉野は奈良県にある。"],["南北朝を統一した室町幕府の3代将軍はどれか。","足利義満",["足利尊氏","足利義政","足利義昭"],"京都の室町に「花の御所」を建てた。"],["日明貿易で、正式な貿易船と倭寇を区別するために使われた証明書はどれか。","勘合",["朱印状","金印","御朱印帳"],"勘合を使ったので勘合貿易ともいう。"],["室町幕府で将軍を補佐した役職はどれか。","管領",["執権","摂政","老中"],"有力な守護大名が管領に任命された。"]]},{"id":"s3-5","name":"歴史:応仁の乱・室町文化・戦国大名","q":[["1467年に応仁の乱が起こったときの室町幕府の将軍はどれか。","足利義政",["足利義満","足利尊氏","足利義昭"],"将軍のあとつぎ問題などから乱が起こった。"],["身分が下の者が、実力で上の身分の者に打ち勝つ風潮を何というか。","下剋上",["院政","御恩","惣"],"応仁の乱のあと、下剋上の風潮が広がった。"],["戦国大名が領国を治めるために独自に定めた法を何というか。","分国法",["御成敗式目","大宝律令","徳政令"],"家臣の行動などを細かく取りしまった。"],["足利義政が京都の東山に建てた建物はどれか。","銀閣",["金閣","平等院鳳凰堂","中尊寺金色堂"],"金閣は足利義満が京都の北山に建てた。"],["畳を敷き、床の間などを設けた、現在の和室のもとになった建築様式はどれか。","書院造",["寝殿造","校倉造","合掌造"],"銀閣と同じ敷地の東求堂同仁斎が代表例。"],["明で水墨画を学び、日本の水墨画を大成した人物はどれか。","雪舟",["世阿弥","運慶","紫式部"],"各地を旅して自然の風景をえがいた。"],["足利義満の保護を受け、能を大成した親子はどれか。","観阿弥・世阿弥",["運慶・快慶","最澄・空海","中大兄皇子・中臣鎌足"],"能の合間には狂言が演じられた。"],["室町時代に、農民たちがつくった村の自治組織を何というか。","惣(惣村)",["座","荘園","五人組"],"寄合を開いて村のおきてを定めた。"],["室町時代に、商人や手工業者がつくった同業者の組合を何というか。","座",["惣(惣村)","五人組","株仲間"],"貴族や寺社に税を納めて営業を独占した。"],["浄土真宗(一向宗)の信者が守護大名を倒し、約100年間自治を行った一揆はどれか。","加賀の一向一揆",["山城国一揆","正長の土一揆","島原・天草一揆"],"加賀は現在の石川県南部にあたる。"]]},{"id":"s3-t","name":"都立入試の形で練習","q":[["アメリカ合衆国の農業について正しく述べた文はどれか。","地域の気候や土壌に合った農作物をつくる適地適作が行われている",["小規模な家族経営による手作業の農業が中心である","西経100度付近より西は降水量が多く、稲作が中心である","農産物の輸出はほとんど行われていない"],"大規模で企業的な農業が行われ、世界有数の農産物輸出国。"],["アメリカ合衆国で、北緯37度付近より南に広がる工業地域の呼び名(A)と、サンフランシスコ郊外のICT企業が集まる地域の呼び名(B)の組み合わせとして正しいものはどれか。","A:サンベルト B:シリコンバレー",["A:シリコンバレー B:サンベルト","A:プレーリー B:シリコンバレー","A:サンベルト B:プレーリー"],"南部のサンベルト、ICT産業のシリコンバレー。プレーリーは草原。"],["アメリカ合衆国に移り住む、メキシコや中南米のスペイン語を話す人々の呼び名として正しいものはどれか。","ヒスパニック",["アボリジニ","マオリ","イヌイット"],"アボリジニはオーストラリア、マオリはニュージーランドの先住民。"],["南アメリカについて正しく述べた文はどれか。","ブラジルでは主にポルトガル語、多くの国ではスペイン語が話されている",["アマゾン川の流域には、乾燥した砂漠が広がっている","アンデス山脈は、大陸の東側を南北に連なっている","ブラジルは、さとうきびからつくるバイオ燃料をまったく生産していない"],"アンデス山脈は西側。アマゾン川流域は熱帯林。"],["南アメリカのアマゾン川流域で見られる伝統的な農業(A)と、近年の課題(B)の組み合わせとして正しいものはどれか。","A:焼畑農業 B:熱帯林の減少",["A:焼畑農業 B:永久凍土の拡大","A:酪農 B:熱帯林の減少","A:地中海式農業 B:熱帯林の減少"],"森林を焼いた灰を肥料にする焼畑。開発で熱帯林の減少が課題。"],["オーストラリアについて正しく述べた文はどれか。","かつての白豪主義を改め、多文化社会を築いている",["国土の大部分が熱帯雨林におおわれている","主な貿易相手国は、現在もイギリスが中心である","鉄鉱石は北東部、石炭は北西部で主に産出する"],"国土の多くは乾燥帯。貿易相手はアジアが中心。鉄鉱石は北西部。"],["次の出来事を古い順に並べたものはどれか。 ①足利義満が南北朝を統一する ②元軍が二度にわたり九州北部に攻めてくる ③後醍醐天皇が建武の新政を始める","②→③→①",["③→②→①","②→①→③","①→③→②"],"元寇(1274・81)→建武の新政(1334)→南北朝統一(1392)。"],["元寇の後に幕府が出した法令(A)と、その目的(B)の組み合わせとして正しいものはどれか。","A:徳政令 B:生活が苦しくなった御家人を救う",["A:徳政令 B:農民から武器を取り上げる","A:御成敗式目 B:生活が苦しくなった御家人を救う","A:御成敗式目 B:農民から武器を取り上げる"],"元寇で十分な恩賞が得られず困窮した御家人を救うため永仁の徳政令。"],["室町時代の日明貿易について正しく述べた文はどれか。","正式な貿易船に勘合という証明書を持たせ、倭寇と区別した",["平清盛が兵庫の港を整備して始めた","遣唐使が持ち帰った品を取引した","朝鮮半島の百済との間で行われた"],"足利義満が始めた勘合貿易。日宋貿易は平清盛。"],["室町時代の農村(A)と都市(B)で、人々がつくった自治組織の組み合わせとして正しいものはどれか。","A:惣 B:町衆による自治",["A:座 B:惣","A:町衆による自治 B:惣","A:惣 B:馬借"],"農村は惣、京都では町衆が自治。座は商工業者の同業組合。"],["室町時代の文化について正しく述べた文はどれか。","観阿弥・世阿弥が能を大成した",["清少納言が枕草子を書いた","運慶らが東大寺南大門の金剛力士像をつくった","正倉院に聖武天皇の遺品が納められた"],"枕草子は平安、金剛力士像は鎌倉、正倉院は奈良時代。"],["応仁の乱が起こった将軍のとき(A)と、その後の世の中の風潮(B)の組み合わせとして正しいものはどれか。","A:足利義政 B:下剋上",["A:足利義満 B:下剋上","A:足利義政 B:院政","A:足利尊氏 B:院政"],"8代将軍義政の後継ぎ争いなどで応仁の乱。下が上に打ち勝つ下剋上へ。"],["戦国大名について正しく述べた文はどれか。","領国を支配するため、独自の分国法を定めた",["幕府から任命された守護として、すべて京都に住んだ","御成敗式目を初めて定め、武士の裁判の基準とした","朝廷から征夷大将軍に任命され、全国の武士を従えた"],"戦国大名は分国法で領国を治めた。御成敗式目は鎌倉時代。"],["1543年に鉄砲を伝えた人々(A)と、その場所(B)の組み合わせとして正しいものはどれか。","A:ポルトガル人 B:種子島",["A:スペイン人 B:種子島","A:ポルトガル人 B:対馬","A:オランダ人 B:平戸"],"種子島に漂着した中国船のポルトガル人が鉄砲を伝えた。"],["次の出来事を古い順に並べたものはどれか。 ①応仁の乱が始まる ②ザビエルがキリスト教を伝える ③鉄砲が伝わる","①→③→②",["③→①→②","①→②→③","②→③→①"],"応仁の乱1467→鉄砲1543→キリスト教1549。"]]}]}]},"eigo":{"name":"英語","textbook":"東京書籍「NEW HORIZON English Course 1」","terms":[{"term":1,"units":[{"id":"e1-1","name":"be動詞と一般動詞","q":[["I （  ） a student.","am",["is","are","be"],"主語がIのときのbe動詞はam。"],["You （  ） from Tokyo.","are",["am","is","be"],"主語がyouのときのbe動詞はare。"],["（  ） ","Saturday"],"月曜日と水曜日の間は火曜日Tuesday。"],["January, February, （  ）, April","March",["May","June","August"],"2月と4月の間は3月March。"],["twelve の序数「12番目」","twelfth",["twelveth","twelvth","twelfeth"],"twelveはveをfにかえて-th。"],["three の序数「3番目」","third",["threeth","thirdth","thrid"],"3番目はthird。不規則な形。"],["long「長い」の反対の意味の語","short",["tall","big","old"],"longの反対はshort(短い)。"],["old「年をとった」の反対の意味の語","young",["long","small","high"],"「年をとった」の反対はyoung(若い)。"]]},{"id":"e3-t","name":"全国テストで差がつく問題","q":[["I （  ） busy yesterday.","was",["am","were","did"],"yesterdayで過去。主語Iのbe動詞の過去形はwas。"],["My parents （  ） in Osaka last week.","were",["was","are","did"],"主語が複数で過去なのでwere。"],["（  ） you at home last night? — Yes, I was.","Were",["Did","Was","Are"],"youのbe動詞の過去形はwere。答えもbe動詞。"],["Emi （  ） not at school yesterday. She was sick.","was",["did","is","were"],"後ろに動詞がないのでbe動詞の過去形was。"],["It （  ） very cold yesterday morning.","was",["is","were","did"],"yesterday morningは過去。主語Itにはwas。"],["I （  ） not go to the park yesterday.","did",["was","am","were"],"一般動詞goの過去の否定はdid not+原形。"],["（  ） Ken help his mother yesterday? — Yes, he did.","Did",["Was","Does","Is"],"一般動詞helpの過去の疑問文はDidで始める。"],["I （  ） TV at nine last night.","was watching",["am watching","were watching","watching"],"過去のある時点にしていたことは was+ing。"],["What （  ） you doing then? — I was studying.","were",["did","are","was"],"thenで過去。you+ingの形なのでwere。"],["They （  ） soccer when I saw them.","were playing",["was playing","are playing","play"],"主語が複数の過去進行形は were+ing。"],["My sister （  ） a letter when I came home.","was writing",["is writing","were writing","writes"],"帰宅した過去の時点なので was writing。"],["Was your brother sleeping then? — No, he （  ）.","wasn't",["didn't","isn't","weren't"],"Was ～?の質問にはwasで答える。"],["Where （  ） Tom and Ken at three yesterday?","were",["was","are","did"],"主語が2人で過去なのでwere。"],["Ken usually （  ） to school. But yesterday he went by bus.","walks",["walk","walking","is walk"],"usuallyは今の習慣。三単現でwalks。"],["Yesterday was Saturday. So today is （  ）.","Sunday",["Friday","Monday","Saturday"],"昨日が土曜日なら今日は日曜日(Sunday)。"]]}]}]}};</script>
<script>
(async function(){
const KEY=(new URLSearchParams(location.search).get("k")||"").trim();
const API="https://script.google.com/macros/s/AKfycby1r1W0vTnkbKJLNlEog6C-kwbMdLcn56dahj6qhBcey8BEuHWdkDMWGsM0o0rp5om3/exec";
function api(fn,args,opt){return fetch(API,Object.assign({method:"POST",credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({k:KEY,fn:fn,args:args||[]})},opt||{})).then(r=>{if(!r.ok)throw new Error("通信できませんでした");return r.json();}).then(j=>{if(!j.ok)throw new Error(j.error||"保存できませんでした");return j.data;});}
document.getElementById("homeLink").href="./?k="+encodeURIComponent(KEY);
document.getElementById("who").textContent="読み込み中…";
let BOOT;
try{
  if(!/^[a-f0-9]{32}$/.test(KEY))throw new Error("このリンクでは開けません。自分用のリンクをもう一度送ってもらってください");
  const b=await api("api_studyBoot");BOOT={token:KEY,me:b.me,name:b.name,state:b.state};
}catch(e){
  document.getElementById("who").textContent="";
  document.getElementById("home").hidden=true;document.getElementById("noUser").hidden=false;
  document.querySelector("#noUser .qtext").textContent=(e&&e.message)||"通信できませんでした";
  return;
}
const DATA = window.STUDY_DATA;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1800);}

if(!BOOT.me){ $("home").hidden=true; $("noUser").hidden=false; return; }
$("who").textContent=BOOT.name+" の記録";

let store={best:(BOOT.state&&BOOT.state.best)||{},miss:(BOOT.state&&BOOT.state.miss)||{}};
let pref={}; try{pref=JSON.parse(localStorage.getItem("chu1drill_pref_"+BOOT.me)||"{}")||{};}catch(e){}
function savePref(){try{localStorage.setItem("chu1drill_pref_"+BOOT.me,JSON.stringify(pref));}catch(e){}}

/* ---- server save (queued so a failed save is retried with the next one) ---- */
const queue=[]; let sending=false;
function saveSession(rec){
  queue.push(rec); flush();
}
function flush(){
  if(sending||!queue.length) return;
  sending=true;
  const rec=Object.assign({},queue[0],{best:store.best,miss:store.miss});
  api("api_studySave",[rec],{keepalive:document.hidden})
    .then(()=>{queue.shift();sending=false;flush();})
    .catch(e=>{sending=false;toast("記録できませんでした。通信を確認してください");});
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ savePartial(); } else flush(); });

const Q={};
for(const sk in DATA) for(const t of DATA[sk].terms) for(const u of t.units) u.q.forEach((x,i)=>{
  const id=u.id+"-"+i; Q[id]={id,subj:sk,term:t.term,unit:u.name,unitId:u.id,q:x[0],a:x[1],w:x[2],e:x[3]};
});
for(const id in store.miss) if(!Q[id]) delete store.miss[id];

const m=new Date().getMonth()+1;
const curTerm=m>=9&&m<=12?2:(m<=3?3:1);
let subj=DATA[pref.subj]?pref.subj:"rika";
let term=[1,2,3].includes(pref.term)?pref.term:curTerm;
let run=null;

function show(id){for(const s of ["home","quiz","result"]) $(s).hidden=s!==id; window.scrollTo(0,0);}
const termOf=()=>DATA[subj].terms.find(t=>t.term===term)||{units:[]};
const idsOfUnit=u=>u.q.map((_,i)=>u.id+"-"+i);

function renderHome(){
  document.body.dataset.s=subj;
  $("tabs").innerHTML=Object.keys(DATA).map(k=>`<button class="tab" role="tab" id="tab-${k}" aria-selected="${k===subj}" data-k="${k}">${DATA[k].name}</button>`).join("");
  $("terms").innerHTML=[1,2,3].map(t=>`<button class="term" id="term-${t}" aria-pressed="${t===term}" data-t="${t}">${t}学期${t===curTerm?"<em>いま</em>":""}</button>`).join("");
  const T=termOf();
  const all=T.units.flatMap(idsOfUnit);
  const bs=store.best["sum-"+subj+"-"+term];
  $("sumBtn").innerHTML=`<div><b>${term}学期まとめテスト</b><span>全単元からランダム20問 ・ 全${all.length}問</span></div><span class="badge${bs?"":" none"}">${bs?`最高 ${bs.c}/${bs.n}`:"未挑戦"}</span>`;
  $("sumBtn").hidden=all.length===0;
  const misses=Object.keys(store.miss).filter(id=>Q[id]&&Q[id].subj===subj);
  const wb=$("weakBtn");
  wb.hidden=misses.length===0;
  wb.innerHTML=`<div><b>${DATA[subj].name}の苦手問題</b><br><span>間違えたまま ${misses.length}問(全学期)</span></div><span class="go">復習する →</span>`;
  $("units").innerHTML=T.units.map(u=>{
    const b=store.best[u.id];
    const badge=b==null?`<span class="badge none">未挑戦</span>`:`<span class="badge">最高 ${b.c}/${b.n}</span>`;
    const mm=idsOfUnit(u).filter(id=>store.miss[id]).length;
    return `<button class="unit" data-u="${u.id}"><div><div class="nm">${esc(u.name)}</div><div class="meta">全${u.q.length}問${mm?` ・ 苦手 ${mm}問`:""}</div></div>${badge}</button>`;
  }).join("");
  $("texNote").textContent="教科書:"+DATA[subj].textbook;
}

function startRun(ids,opt){
  const n=opt.n||10;
  const pick=shuffle(ids).slice(0,n).map(id=>({id,choices:shuffle([Q[id].a,...Q[id].w])}));
  run={items:pick,i:0,correct:0,answered:0,wrong:[],pool:ids,n,label:opt.label,bestKey:opt.bestKey||null,
       mixed:!!opt.mixed,mode:opt.mode,subj:opt.subj||subj,term:opt.term||0,unitId:opt.unitId||"",unitName:opt.unitName||"",sa:0,sc:0,sw:0};
  show("quiz"); renderQ();
}

function renderQ(){
  const it=run.items[run.i], q=Q[it.id];
  $("qlabel").textContent=run.label;
  $("bar").style.width=(run.i/run.items.length*100)+"%";
  $("qno").textContent=`第${run.i+1}問 / ${run.items.length}`+(run.mixed?` ・ ${q.unit}`:"");
  $("qtext").textContent=q.q;
  $("choices").innerHTML=it.choices.map((c,i)=>`<button class="ch" data-c="${i}"><span class="k">${"アイウエ"[i]}</span><span>${esc(c)}</span></button>`).join("");
  $("fb").hidden=true; $("nextBtn").hidden=true; $("ask").hidden=true; $("gemCopy").hidden=true;
}

function answer(idx){
  const it=run.items[run.i], q=Q[it.id];
  if(it.done) return; it.done=true; it.picked=it.choices[idx];
  const ok=it.picked===q.a;
  run.answered++;
  [...$("choices").children].forEach((b,i)=>{b.disabled=true; if(it.choices[i]===q.a) b.classList.add("ok"); else if(i===idx) b.classList.add("ng");});
  if(ok){run.correct++; delete store.miss[it.id];} else {run.wrong.push(it.id); store.miss[it.id]=1;}
  const fb=$("fb"); fb.className="fb "+(ok?"ok":"ng");
  fb.innerHTML=`<b>${ok?"正解!":"ざんねん… 正解は「"+esc(q.a)+"」"}</b><p>${esc(q.e)}</p>`;
  fb.hidden=false; $("ask").hidden=false;
  const nb=$("nextBtn"); nb.textContent=run.i+1<run.items.length?"次の問題へ":"結果を見る"; nb.hidden=false;
  $("bar").style.width=((run.i+1)/run.items.length*100)+"%";
  nb.focus({preventScroll:true}); nb.scrollIntoView({block:"nearest",behavior:"smooth"});
}

// 前回保存した後に解いた分だけを記録する(途中でアプリを閉じても、続きを解いても二重にならない)
function record(){
  if(!run) return;
  const da=run.answered-run.sa; if(da<=0) return;
  saveSession({subj:run.subj,term:run.term,unitId:run.unitId,unitName:run.unitName,mode:run.mode,correct:run.correct-run.sc,total:da,wrong:run.wrong.slice(run.sw)});
  run.sa=run.answered; run.sc=run.correct; run.sw=run.wrong.length;
}
function savePartial(){ if(run&&!$("quiz").hidden) record(); else flush(); }

function finish(){
  const n=run.items.length,c=run.correct;
  if(run.bestKey){const b=store.best[run.bestKey]; if(!b||c/n>b.c/b.n||(c/n===b.c/b.n&&n>b.n)) store.best[run.bestKey]={c,n};}
  record();
  $("sc").innerHTML=`${c}<small> / ${n}</small>`;
  const r=c/n;
  $("scMsg").textContent=r===1?"全問正解!完ぺきです。":r>=0.8?"よくできました。あと少し!":r>=0.5?"半分以上できました。間違えた所を復習しよう。":"まずは解説を読んで、もう一度やってみよう。";
  if(c)$("scMsg").textContent+="(がんばりポイント +"+c+"pt)";
  $("retryWrong").hidden=run.wrong.length===0;
  $("mhead").hidden=run.wrong.length===0;
  $("mlist").innerHTML=run.wrong.map(id=>{const q=Q[id];return `<li>${esc(q.q)}<br>→ <span class="ans">${esc(q.a)}</span></li>`;}).join("");
  show("result");
}

/* ---- Gemini handoff ---- */
function ctxText(){
  const it=run.items[run.i], q=Q[it.id];
  return `中学1年 ${DATA[q.subj].name}(${q.term}学期・${q.unit})の4択問題です。\n問題:${q.q}\n選択肢:${it.choices.join(" / ")}\n正解:${q.a}\n解説:${q.e}\n私が選んだ答え:${it.picked||""}\n\nこの問題について、中学1年生にわかるようにくわしく教えてください。`;
}
$("gemBtn").addEventListener("click",()=>{
  const t=ctxText(), box=$("gemCopy");
  box.value=t; box.hidden=false;
  let done=false;
  try{ box.select(); done=document.execCommand("copy"); }catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast("問題をコピーしました。Geminiに貼り付けてください"),()=>{ if(!done) toast("下の文章を長押しでコピーしてください"); });
  } else toast(done?"問題をコピーしました。Geminiに貼り付けてください":"下の文章を長押しでコピーしてください");
});

$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab"); if(!b) return; subj=b.dataset.k; pref.subj=subj; savePref(); renderHome();});
$("terms").addEventListener("click",e=>{const b=e.target.closest(".term"); if(!b) return; term=+b.dataset.t; pref.term=term; savePref(); renderHome();});
$("units").addEventListener("click",e=>{const b=e.target.closest(".unit"); if(!b) return; const u=termOf().units.find(x=>x.id===b.dataset.u);
  startRun(idsOfUnit(u),{label:`${DATA[subj].name} ${term}学期|${u.name}`,bestKey:u.id,mode:"unit",term,unitId:u.id,unitName:u.name});});
$("sumBtn").addEventListener("click",()=>{const ids=termOf().units.flatMap(idsOfUnit);
  startRun(ids,{n:20,label:`${DATA[subj].name}|${term}学期まとめ`,bestKey:"sum-"+subj+"-"+term,mixed:true,mode:"summary",term,unitName:term+"学期まとめテスト"});});
$("weakBtn").addEventListener("click",()=>{const ids=Object.keys(store.miss).filter(id=>Q[id]&&Q[id].subj===subj);
  if(ids.length) startRun(ids,{label:`${DATA[subj].name}|苦手問題`,mixed:true,mode:"weak",unitName:"苦手問題の復習"});});
$("choices").addEventListener("click",e=>{const b=e.target.closest(".ch"); if(b) answer(+b.dataset.c);});
$("nextBtn").addEventListener("click",()=>{run.i++; if(run.i<run.items.length) renderQ(); else finish();});
$("quitBtn").addEventListener("click",()=>{record(); renderHome(); show("home");});
$("homeBtn").addEventListener("click",()=>{renderHome(); show("home");});
$("retryAll").addEventListener("click",()=>{const o=run; startRun(o.pool,{n:o.n,label:o.label,bestKey:o.bestKey,mixed:o.mixed,mode:o.mode,subj:o.subj,term:o.term,unitId:o.unitId,unitName:o.unitName});});
$("retryWrong").addEventListener("click",()=>{const o=run; startRun(o.wrong.slice(),{label:o.label.replace(/\|.*/,"")+"|間違えた問題",mixed:true,mode:"retry",subj:o.subj,term:o.term,unitId:o.unitId,unitName:(o.unitName||"")+"(やり直し)"});});

renderHome(); show("home");
})();
</script>
</body>
</html>
